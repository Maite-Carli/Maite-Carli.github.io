# ---------------------------------------------------------------------------
# Data for the seminar page at /seminars/  (rendered by _pages/seminar.md)
#
# To add a talk:    add a new "- date: ..." block to `talks:` below.
# To add notes:     fill in the `notes:` line of that talk with a link to a PDF
#                   you have put in the /files/ folder of this repository, e.g.
#                       notes: /files/algebraic-models-talk-1.pdf
#                   The "Notes" column of the table is hidden while every talk
#                   has an empty `notes:`, and appears by itself as soon as the
#                   first one is filled in. Nothing else needs changing.
#
# The title of the seminar is the `title:` in the front matter of
# _pages/seminar.md (that is what becomes the heading and the browser tab).
# ---------------------------------------------------------------------------

semester: "Autumn 2026"

# Practical information. Delete a line to hide it.
when: "Wednesdays, 13:00-15:00"
where: "Room 7.07, Hans Freudenthalgebouw, Utrecht University"

# Optional, and currently unused. Uncomment either one to make it appear:
# an introductory paragraph above the practical information (markdown works),
# and a "Who" line beneath "Where".
# description: >
#   A learning seminar on algebraic models for spaces.
# audience: "Everyone is welcome."

# Link to the syllabus PDF (the file lives in /files/).
syllabus: /files/Algebraic_Models_for_Spaces_syllabus.pdf

# Optional "Organised by" line. Uncomment to make it appear.
# organisers:
#   - name: "Maite Carli"
#     url: https://example.com

# Optional closing line. Delete it to hide it.
contact: >
  The syllabus contains a detailed description of each talk together with the
  relevant references.

# ---------------------------------------------------------------------------
# The talks. Fields per entry:
#   part     - section heading of the syllabus. Repeat it on consecutive talks;
#              it is printed once, above the first talk that carries it.
#   number   - the talk number in the syllabus. Omit it for a meeting.
#   date     - date of the talk (YYYY-MM-DD). Omit it for "TBA".
#   title    - title of the talk.
#   details  - optional second line: scope, references, sections covered.
#   speaker  - name of the speaker. Omit it for "TBA".
#   url      - optional homepage of the speaker.
#   notes    - link to the notes, added once they are written (see above).
# ---------------------------------------------------------------------------
